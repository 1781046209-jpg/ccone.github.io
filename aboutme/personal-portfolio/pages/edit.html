<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑资料</title>
    <style id="theme-vars">
:root {
  /* 语义色（供页面渲染桥接使用） */
  --brand-background: #FFFFFF;
  --brand-foreground: #16181D;
  --brand-card: #F7F8FA;
  --brand-card-foreground: #16181D;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #16181D;
  --brand-primary: #2B59FF;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #EFF1F5;
  --brand-muted-foreground: #6B7280;
  --brand-border: #E8EAEE;
  --brand-input: #D8DCE3;
  --brand-ring: #2B59FF;

  /* 扩展中性色与主色层级 */
  --brand-surface-2: #F1F3F7;
  --brand-ink-2: #5A6069;
  --brand-ink-3: #9AA1AB;
  --brand-primary-soft: #EDF1FF;
  --brand-primary-strong: #1F44D6;

  /* 圆角 */
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  /* 阴影 */
  --brand-shadow-sm: 0 1px 2px rgba(22, 24, 29, 0.05);
  --brand-shadow-md: 0 12px 32px -16px rgba(22, 24, 29, 0.28);
  --brand-shadow-lg: 0 24px 64px -32px rgba(22, 24, 29, 0.35);

  /* 字体 */
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
  <header class="border-b border-[var(--brand-border)]">
    <div class="mx-auto flex h-16 max-w-3xl items-center justify-between px-5 sm:px-6">
      <a href="index.html" data-dom-id="back-home" class="inline-flex items-center gap-1.5 text-sm text-[var(--brand-ink-2)] transition-colors hover:text-[var(--brand-foreground)]"><i data-lucide="arrow-left" class="h-4 w-4"></i>返回作品集</a>
      <span class="text-sm font-medium text-[var(--brand-foreground)]">编辑资料</span>
      <span class="w-16"></span>
    </div>
  </header>

  <div class="mx-auto max-w-3xl px-5 py-12 sm:px-6">
    <form id="profile-form" class="space-y-12">
      <section>
        <h2 class="text-base font-semibold text-[var(--brand-foreground)]">基本信息</h2>
        <div class="mt-6 grid grid-cols-1 gap-5 sm:grid-cols-2">
          <label class="block"><span class="text-sm text-[var(--brand-ink-2)]">姓名</span><input name="name" type="text" class="field mt-2" /></label>
          <label class="block"><span class="text-sm text-[var(--brand-ink-2)]">头衔</span><input name="title" type="text" class="field mt-2" placeholder="产品设计师 · 前端开发" /></label>
          <label class="block sm:col-span-2"><span class="text-sm text-[var(--brand-ink-2)]">一句话简介</span><input name="intro" type="text" class="field mt-2" /></label>
          <label class="block"><span class="text-sm text-[var(--brand-ink-2)]">所在地</span><input name="location" type="text" class="field mt-2" /></label>
          <label class="block"><span class="text-sm text-[var(--brand-ink-2)]">头像链接（可选）</span><input name="avatar" type="url" class="field mt-2" placeholder="https://..." /></label>
        </div>
      </section>

      <section>
        <h2 class="text-base font-semibold text-[var(--brand-foreground)]">关于我</h2>
        <div class="mt-6">
          <label class="block"><span class="text-sm text-[var(--brand-ink-2)]">个人简介</span><textarea name="bio" rows="4" class="field mt-2"></textarea></label>
        </div>
      </section>

      <section>
        <h2 class="text-base font-semibold text-[var(--brand-foreground)]">技能</h2>
        <div class="mt-6">
          <label class="block"><span class="text-sm text-[var(--brand-ink-2)]">技能（用逗号分隔）</span><input name="skills" type="text" class="field mt-2" placeholder="产品设计, 交互设计" /></label>
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-[var(--brand-foreground)]">项目</h2>
          <button type="button" id="add-project" class="inline-flex h-9 items-center rounded-[var(--brand-radius-sm)] border border-[var(--brand-border)] px-3 text-sm text-[var(--brand-foreground)] transition-colors hover:bg-[var(--brand-surface-2)]">添加项目</button>
        </div>
        <div id="projects-container" class="mt-6 space-y-5"></div>
      </section>

      <section>
        <h2 class="text-base font-semibold text-[var(--brand-foreground)]">联系方式</h2>
        <div class="mt-6 grid grid-cols-1 gap-5 sm:grid-cols-2">
          <label class="block"><span class="text-sm text-[var(--brand-ink-2)]">邮箱</span><input name="email" type="email" class="field mt-2" /></label>
          <label class="block"><span class="text-sm text-[var(--brand-ink-2)]">电话</span><input name="phone" type="text" class="field mt-2" /></label>
          <label class="block sm:col-span-2"><span class="text-sm text-[var(--brand-ink-2)]">网站</span><input name="website" type="text" class="field mt-2" placeholder="example.com" /></label>
        </div>
        <div class="mt-8">
          <div class="flex items-center justify-between">
            <span class="text-sm text-[var(--brand-ink-2)]">社交链接</span>
            <button type="button" id="add-social" class="inline-flex h-9 items-center rounded-[var(--brand-radius-sm)] border border-[var(--brand-border)] px-3 text-sm text-[var(--brand-foreground)] transition-colors hover:bg-[var(--brand-surface-2)]">添加链接</button>
          </div>
          <div id="socials-container" class="mt-4 space-y-3"></div>
        </div>
      </section>

      <div class="flex flex-wrap items-center gap-3 border-t border-[var(--brand-border)] pt-8">
        <button type="submit" class="inline-flex h-10 items-center rounded-[var(--brand-radius-sm)] bg-[var(--brand-primary)] px-6 text-sm font-medium text-[var(--brand-primary-foreground)] transition-colors hover:bg-[var(--brand-primary-strong)]">保存</button>
        <button type="button" id="reset-profile" class="inline-flex h-10 items-center rounded-[var(--brand-radius-sm)] border border-[var(--brand-border)] px-5 text-sm text-[var(--brand-foreground)] transition-colors hover:bg-[var(--brand-surface-2)]">恢复默认</button>
        <a href="index.html" class="text-sm text-[var(--brand-ink-2)] transition-colors hover:text-[var(--brand-foreground)]">取消</a>
      </div>
    </form>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 z-30 hidden -translate-x-1/2 rounded-[var(--brand-radius-md)] bg-[var(--brand-foreground)] px-4 py-2.5 text-sm text-[var(--brand-background)] shadow-[var(--brand-shadow-md)]">已保存</div>
</main>
    <style>
      html, body { font-family: var(--brand-font-sans); }
      ::selection { background: var(--brand-primary-soft); color: var(--brand-primary-strong); }
      .field { width: 100%; height: 42px; border-radius: var(--brand-radius-sm); border: 1px solid var(--brand-input); background: var(--brand-background); padding: 0 12px; font-size: 14px; color: var(--brand-foreground); outline: none; transition: border-color 140ms, box-shadow 140ms; }
      .field:focus { border-color: var(--brand-ring); box-shadow: 0 0 0 3px var(--brand-primary-soft); }
      textarea.field { height: auto; padding-top: 10px; padding-bottom: 10px; line-height: 1.6; }
    </style>
    <script>lucide.createIcons();</script>
    <script>
(function () {
  var STORAGE_KEY = 'portfolioData';
  var DEFAULT_DATA = {
    name: '陈默',
    title: '产品设计师 · 前端开发',
    intro: '专注于简洁、易用、有温度的数字化产品。',
    location: '上海',
    email: 'hello@chenmo.design',
    phone: '+86 138 0000 0000',
    website: 'chenmo.design',
    avatar: '',
    bio: '我是一名热爱设计的产品设计师，拥有 6 年从 0 到 1 的产品设计经验。相信好的设计应当克制而高效，用更少的元素传递更清晰的信息。',
    skills: ['产品设计', '交互设计', '用户研究', '前端开发', 'Figma', 'React'],
    projects: [
      { name: '织羽 · 效率笔记', description: '一款轻量、聚焦的极简笔记应用，帮助用户快速记录与整理灵感。', year: '2025', tags: ['产品设计', '前端'] },
      { name: '青禾 · 品牌官网', description: '为有机农产品品牌打造的官网，传递自然、健康、可信赖的品牌形象。', year: '2024', tags: ['品牌设计', '网页设计'] },
      { name: '拾光 · 个人站点', description: '一个排版驱动的个人作品集，探索留白与文字节奏的表达。', year: '2023', tags: ['网页设计', '开发'] }
    ],
    socials: [
      { label: 'GitHub', url: 'https://github.com/' },
      { label: '即刻', url: 'https://web.okjike.com/' },
      { label: '小红书', url: 'https://www.xiaohongshu.com/' }
    ]
  };
  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
      return Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), JSON.parse(raw));
    } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  }
  function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  function resetData() { localStorage.removeItem(STORAGE_KEY); }

  var form = document.getElementById('profile-form');
  var projectsContainer = document.getElementById('projects-container');
  var socialsContainer = document.getElementById('socials-container');

  function projectRow(p) {
    var row = document.createElement('div');
    row.className = 'project-row rounded-[var(--brand-radius-md)] border border-[var(--brand-border)] p-4';
    row.innerHTML =
      '<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">' +
      '<label class="block"><span class="text-xs text-[var(--brand-ink-3)]">名称</span><input class="field mt-1 p-name" type="text" value="' + esc(p.name) + '" /></label>' +
      '<label class="block"><span class="text-xs text-[var(--brand-ink-3)]">年份</span><input class="field mt-1 p-year" type="text" value="' + esc(p.year) + '" /></label>' +
      '<label class="block sm:col-span-2"><span class="text-xs text-[var(--brand-ink-3)]">简介</span><input class="field mt-1 p-desc" type="text" value="' + esc(p.description) + '" /></label>' +
      '<label class="block sm:col-span-2"><span class="text-xs text-[var(--brand-ink-3)]">标签（逗号分隔）</span><input class="field mt-1 p-tags" type="text" value="' + esc((p.tags || []).join(', ')) + '" /></label>' +
      '</div>' +
      '<div class="mt-3 flex justify-end"><button type="button" data-remove class="inline-flex items-center gap-1.5 text-sm text-[var(--brand-ink-3)] transition-colors hover:text-[var(--brand-foreground)]"><i data-lucide="trash-2" class="h-4 w-4"></i>删除</button></div>';
    return row;
  }
  function socialRow(s) {
    var row = document.createElement('div');
    row.className = 'social-row grid grid-cols-1 gap-3 sm:grid-cols-[160px_1fr_auto] sm:items-end';
    row.innerHTML =
      '<label class="block"><span class="text-xs text-[var(--brand-ink-3)]">平台</span><input class="field mt-1 s-label" type="text" value="' + esc(s.label) + '" /></label>' +
      '<label class="block"><span class="text-xs text-[var(--brand-ink-3)]">链接</span><input class="field mt-1 s-url" type="text" value="' + esc(s.url) + '" /></label>' +
      '<button type="button" data-remove class="inline-flex h-10 items-center justify-center rounded-[var(--brand-radius-sm)] border border-[var(--brand-border)] px-3 text-sm text-[var(--brand-ink-3)] transition-colors hover:text-[var(--brand-foreground)]">删除</button>';
    return row;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function splitTags(value) {
    return String(value || '').split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function collect() {
    return {
      name: form.name.value.trim() || '未命名',
      title: form.title.value.trim(),
      intro: form.intro.value.trim(),
      location: form.location.value.trim(),
      avatar: form.avatar.value.trim(),
      bio: form.bio.value.trim(),
      skills: splitTags(form.skills.value),
      projects: Array.prototype.map.call(projectsContainer.querySelectorAll('.project-row'), function (row) {
        return {
          name: row.querySelector('.p-name').value.trim(),
          year: row.querySelector('.p-year').value.trim(),
          description: row.querySelector('.p-desc').value.trim(),
          tags: splitTags(row.querySelector('.p-tags').value)
        };
      }),
      email: form.email.value.trim(),
      phone: form.phone.value.trim(),
      website: form.website.value.trim(),
      socials: Array.prototype.map.call(socialsContainer.querySelectorAll('.social-row'), function (row) {
        return { label: row.querySelector('.s-label').value.trim(), url: row.querySelector('.s-url').value.trim() };
      })
    };
  }
  function populate(data) {
    form.name.value = data.name;
    form.title.value = data.title;
    form.intro.value = data.intro;
    form.location.value = data.location;
    form.avatar.value = data.avatar;
    form.bio.value = data.bio;
    form.skills.value = data.skills.join(', ');
    form.email.value = data.email;
    form.phone.value = data.phone;
    form.website.value = data.website;
    projectsContainer.innerHTML = '';
    data.projects.forEach(function (p) { projectsContainer.appendChild(projectRow(p)); });
    socialsContainer.innerHTML = '';
    data.socials.forEach(function (s) { socialsContainer.appendChild(socialRow(s)); });
    lucide.createIcons();
  }
  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.remove('hidden');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.add('hidden'); }, 2000);
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); saveData(collect()); showToast('已保存'); });
  document.getElementById('reset-profile').addEventListener('click', function () { resetData(); populate(DEFAULT_DATA); showToast('已恢复默认'); });
  document.getElementById('add-project').addEventListener('click', function () { projectsContainer.appendChild(projectRow({ name: '', year: '', description: '', tags: [] })); lucide.createIcons(); });
  document.getElementById('add-social').addEventListener('click', function () { socialsContainer.appendChild(socialRow({ label: '', url: '' })); });
  document.addEventListener('click', function (e) {
    var removeBtn = e.target.closest('[data-remove]');
    if (!removeBtn) return;
    var row = removeBtn.closest('.project-row, .social-row');
    if (row) row.parentNode.removeChild(row);
  });
  populate(loadData());
})();
    </script>
</body>
</html>
