<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集</title>
    <style id="theme-vars">
:root {
  /* 语义色（供页面渲染桥接使用） */
  --brand-background: #FFFFFF;
  --brand-foreground: #16181D;
  --brand-card: #F7F8FA;
  --brand-card-foreground: #16181D;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #16181D;
  --brand-primary: #2B59FF;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #EFF1F5;
  --brand-muted-foreground: #6B7280;
  --brand-border: #E8EAEE;
  --brand-input: #D8DCE3;
  --brand-ring: #2B59FF;

  /* 扩展中性色与主色层级 */
  --brand-surface-2: #F1F3F7;
  --brand-ink-2: #5A6069;
  --brand-ink-3: #9AA1AB;
  --brand-primary-soft: #EDF1FF;
  --brand-primary-strong: #1F44D6;

  /* 圆角 */
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  /* 阴影 */
  --brand-shadow-sm: 0 1px 2px rgba(22, 24, 29, 0.05);
  --brand-shadow-md: 0 12px 32px -16px rgba(22, 24, 29, 0.28);
  --brand-shadow-lg: 0 24px 64px -32px rgba(22, 24, 29, 0.35);

  /* 字体 */
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);

    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

<body class="min-h-screen font-sans antialiased">
    <main>
  <header class="sticky top-0 z-20 border-b border-[var(--brand-border)] bg-[var(--brand-background)]/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-3xl items-center justify-between px-5 sm:px-6">
      <a href="index.html" id="nav-name" class="text-[15px] font-semibold tracking-tight text-[var(--brand-foreground)]">陈默</a>
      <nav class="flex items-center gap-4">
        <a href="#about" class="text-sm text-[var(--brand-ink-2)] transition-colors hover:text-[var(--brand-foreground)]">关于</a>
        <a href="#projects" class="text-sm text-[var(--brand-ink-2)] transition-colors hover:text-[var(--brand-foreground)]">项目</a>
        <a href="#contact" class="text-sm text-[var(--brand-ink-2)] transition-colors hover:text-[var(--brand-foreground)]">联系</a>
        <a href="../resume.docx" download class="inline-flex h-9 items-center gap-1.5 rounded-[var(--brand-radius-sm)] border border-[var(--brand-border)] px-3 text-sm font-medium text-[var(--brand-foreground)] transition-colors hover:bg-[var(--brand-surface-2)]"><i data-lucide="download" class="h-4 w-4"></i>下载简历</a>
        <a href="edit.html" data-dom-id="edit-profile" class="inline-flex h-9 items-center rounded-[var(--brand-radius-sm)] bg-[var(--brand-primary)] px-4 text-sm font-medium text-[var(--brand-primary-foreground)] transition-colors hover:bg-[var(--brand-primary-strong)]">编辑资料</a>
      </nav>
    </div>
  </header>

  <section class="mx-auto max-w-3xl px-5 pb-16 pt-20 sm:px-6 sm:pt-24">
    <div class="flex flex-col gap-10 sm:flex-row sm:items-start sm:justify-between">
      <div class="max-w-xl">
        <h1 id="hero-name" class="text-[clamp(2.5rem,6vw,4rem)] font-semibold leading-[1.05] tracking-[-0.03em] text-[var(--brand-foreground)]">陈默</h1>
        <p id="hero-title" class="mt-5 text-lg text-[var(--brand-ink-2)]">产品设计师 · 前端开发</p>
        <p id="hero-intro" class="mt-3 max-w-md text-[15px] leading-relaxed text-[var(--brand-ink-2)]">专注于简洁、易用、有温度的数字化产品。</p>
        <div class="mt-8 flex flex-wrap items-center gap-4">
          <a href="#projects" class="inline-flex h-10 items-center rounded-[var(--brand-radius-sm)] bg-[var(--brand-primary)] px-5 text-sm font-medium text-[var(--brand-primary-foreground)] transition-colors hover:bg-[var(--brand-primary-strong)]">查看项目</a>
          <span id="hero-location" class="inline-flex items-center gap-1.5 text-sm text-[var(--brand-ink-3)]"><i data-lucide="map-pin" class="h-4 w-4"></i>上海</span>
        </div>
      </div>
      <div id="hero-avatar" class="hidden shrink-0 sm:block"></div>
    </div>
  </section>

  <section id="about" class="mx-auto max-w-3xl px-5 py-16 sm:px-6">
    <h2 class="text-sm font-medium text-[var(--brand-ink-3)]">关于</h2>
    <p id="about-bio" class="mt-5 text-[17px] leading-relaxed text-[var(--brand-foreground)]">我是一名热爱设计的产品设计师。</p>
    <dl class="mt-8 grid grid-cols-1 gap-x-8 gap-y-4 sm:grid-cols-3">
      <div><dt class="text-xs text-[var(--brand-ink-3)]">所在地</dt><dd id="fact-location" class="mt-1 text-sm text-[var(--brand-foreground)]">上海</dd></div>
      <div><dt class="text-xs text-[var(--brand-ink-3)]">邮箱</dt><dd id="fact-email" class="mt-1 text-sm text-[var(--brand-foreground)]">hello@chenmo.design</dd></div>
      <div><dt class="text-xs text-[var(--brand-ink-3)]">网站</dt><dd id="fact-website" class="mt-1 text-sm text-[var(--brand-foreground)]">chenmo.design</dd></div>
    </dl>
  </section>

  <section id="skills" class="mx-auto max-w-3xl px-5 py-16 sm:px-6">
    <h2 class="text-sm font-medium text-[var(--brand-ink-3)]">技能</h2>
    <div id="skills-list" class="mt-5 flex flex-wrap gap-2"></div>
  </section>

  <section id="projects" class="mx-auto max-w-3xl px-5 py-16 sm:px-6">
    <h2 class="text-sm font-medium text-[var(--brand-ink-3)]">项目</h2>
    <div id="projects-list" class="mt-6 divide-y divide-[var(--brand-border)]"></div>
  </section>

  <section id="contact" class="mx-auto max-w-3xl px-5 py-16 sm:px-6">
    <h2 class="text-sm font-medium text-[var(--brand-ink-3)]">联系</h2>
    <div id="contact-list" class="mt-6 grid grid-cols-1 gap-x-8 gap-y-4 sm:grid-cols-2"></div>
  </section>

  <footer class="border-t border-[var(--brand-border)]">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-5 py-8 text-sm text-[var(--brand-ink-3)] sm:px-6">
      <span id="footer-name">© 陈默</span>
      <a href="edit.html" class="transition-colors hover:text-[var(--brand-foreground)]">编辑资料</a>
    </div>
  </footer>
</main>
    <style>
      html, body { font-family: var(--brand-font-sans); }
      ::selection { background: var(--brand-primary-soft); color: var(--brand-primary-strong); }
      html { scroll-behavior: smooth; }
    </style>
    <script>lucide.createIcons();</script>
    <script>
(function () {
  var STORAGE_KEY = 'portfolioData';
  var DEFAULT_DATA = {
    name: '陈默',
    title: '产品设计师 · 前端开发',
    intro: '专注于简洁、易用、有温度的数字化产品。',
    location: '上海',
    email: 'hello@chenmo.design',
    phone: '+86 138 0000 0000',
    website: 'chenmo.design',
    avatar: '',
    bio: '我是一名热爱设计的产品设计师，拥有 6 年从 0 到 1 的产品设计经验。相信好的设计应当克制而高效，用更少的元素传递更清晰的信息。',
    skills: ['产品设计', '交互设计', '用户研究', '前端开发', 'Figma', 'React'],
    projects: [
      { name: '织羽 · 效率笔记', description: '一款轻量、聚焦的极简笔记应用，帮助用户快速记录与整理灵感。', year: '2025', tags: ['产品设计', '前端'] },
      { name: '青禾 · 品牌官网', description: '为有机农产品品牌打造的官网，传递自然、健康、可信赖的品牌形象。', year: '2024', tags: ['品牌设计', '网页设计'] },
      { name: '拾光 · 个人站点', description: '一个排版驱动的个人作品集，探索留白与文字节奏的表达。', year: '2023', tags: ['网页设计', '开发'] }
    ],
    socials: [
      { label: 'GitHub', url: 'https://github.com/' },
      { label: '即刻', url: 'https://web.okjike.com/' },
      { label: '小红书', url: 'https://www.xiaohongshu.com/' }
    ]
  };
  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
      return Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), JSON.parse(raw));
    } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function setText(id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = value;
  }
  function render(data) {
    setText('nav-name', data.name);
    setText('footer-name', '© ' + data.name);
    setText('hero-name', data.name);
    setText('hero-title', data.title);
    setText('hero-intro', data.intro);
    document.getElementById('hero-location').innerHTML = '<i data-lucide="map-pin" class="h-4 w-4"></i>' + esc(data.location);
    var avatarEl = document.getElementById('hero-avatar');
    if (avatarEl) {
      if (data.avatar) {
        avatarEl.innerHTML = '<img src="' + esc(data.avatar) + '" alt="头像" class="h-24 w-24 rounded-full object-cover" />';
      } else {
        avatarEl.innerHTML = '<div class="flex h-24 w-24 items-center justify-center rounded-full bg-[var(--brand-primary-soft)] text-3xl font-semibold text-[var(--brand-primary)]">' + esc((data.name || '我').charAt(0)) + '</div>';
      }
    }
    setText('about-bio', data.bio);
    setText('fact-location', data.location);
    setText('fact-email', data.email);
    setText('fact-website', data.website);
    document.getElementById('skills-list').innerHTML = data.skills.map(function (s) {
      return '<span class="rounded-full bg-[var(--brand-surface-2)] px-3 py-1.5 text-sm text-[var(--brand-ink-2)]">' + esc(s) + '</span>';
    }).join('');
    document.getElementById('projects-list').innerHTML = data.projects.map(function (p) {
      return '<article class="flex flex-col gap-2 py-6 sm:flex-row sm:items-baseline sm:justify-between">' +
        '<div class="max-w-lg">' +
        '<h3 class="text-base font-medium text-[var(--brand-foreground)]">' + esc(p.name) + '</h3>' +
        '<p class="mt-1 text-sm leading-relaxed text-[var(--brand-ink-2)]">' + esc(p.description) + '</p>' +
        '<div class="mt-3 flex flex-wrap gap-2">' + (p.tags || []).map(function (t) { return '<span class="rounded-full bg-[var(--brand-surface-2)] px-2.5 py-1 text-xs text-[var(--brand-ink-2)]">' + esc(t) + '</span>'; }).join('') + '</div>' +
        '</div>' +
        '<span class="text-sm text-[var(--brand-ink-3)]">' + esc(p.year) + '</span>' +
        '</article>';
    }).join('');
    var contact = [];
    contact.push('<a href="mailto:' + esc(data.email) + '" class="flex items-center gap-3 rounded-[var(--brand-radius-md)] border border-[var(--brand-border)] px-4 py-3 text-sm text-[var(--brand-foreground)] transition-colors hover:border-[var(--brand-input)]"><i data-lucide="mail" class="h-4 w-4 text-[var(--brand-ink-3)]"></i>' + esc(data.email) + '</a>');
    contact.push('<div class="flex items-center gap-3 rounded-[var(--brand-radius-md)] border border-[var(--brand-border)] px-4 py-3 text-sm text-[var(--brand-foreground)]"><i data-lucide="phone" class="h-4 w-4 text-[var(--brand-ink-3)]"></i>' + esc(data.phone) + '</div>');
    contact.push('<a href="https://' + esc(data.website) + '" target="_blank" rel="noopener" class="flex items-center gap-3 rounded-[var(--brand-radius-md)] border border-[var(--brand-border)] px-4 py-3 text-sm text-[var(--brand-foreground)] transition-colors hover:border-[var(--brand-input)]"><i data-lucide="globe" class="h-4 w-4 text-[var(--brand-ink-3)]"></i>' + esc(data.website) + '</a>');
    data.socials.forEach(function (s) {
      contact.push('<a href="' + esc(s.url) + '" target="_blank" rel="noopener" class="flex items-center gap-3 rounded-[var(--brand-radius-md)] border border-[var(--brand-border)] px-4 py-3 text-sm text-[var(--brand-foreground)] transition-colors hover:border-[var(--brand-input)]"><i data-lucide="external-link" class="h-4 w-4 text-[var(--brand-ink-3)]"></i>' + esc(s.label) + '</a>');
    });
    document.getElementById('contact-list').innerHTML = contact.join('');
    lucide.createIcons();
  }
  render(loadData());
})();
    </script>
</body>
